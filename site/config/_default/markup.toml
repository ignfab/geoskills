# Required by Blowfish (copied from its config/_default/markup.toml), plus GitHub-style
# heading IDs so that the anchors used in the repository Markdown keep working.

[goldmark]
  [goldmark.parser]
    autoHeadingID = true
    autoHeadingIDType = "github"
    wrapStandAloneImageWithinParagraph = false

    [goldmark.parser.attribute]
      block = true

  [goldmark.renderer]
    unsafe = true

  [goldmark.extensions]
    [goldmark.extensions.passthrough]
      enable = true
      [goldmark.extensions.passthrough.delimiters]
        block = [['\[', '\]'], ['$$', '$$']]
        inline = [['\(', '\)']]

[highlight]
  noClasses = false

[tableOfContents]
  startLevel = 2
  endLevel = 3
