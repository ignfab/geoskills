name: QGIS integration
on:
  push:
  pull_request:

jobs:
  qgis:
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
      GEOSKILLS_REQUIRE_QGIS: '1'
    steps:
      - uses: actions/checkout@v5
      - name: Prepare the dedicated QGIS test environment
        run: sudo apt-get update && sudo apt-get install -y python3-qgis
      - name: Run real QML and project integration tests
        run: /usr/bin/python3 -m unittest discover -s tests -p 'test_qgis*.py' -v
