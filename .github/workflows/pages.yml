name: Site
# Builds the Hugo site from the repository Markdown on every pull request and push to main,
# and keeps it as the `site-preview` artifact, which site/README.md explains how to serve
# locally. From main it also deploys to GitHub Pages, once an administrator has set
# Settings > Pages > Source = "GitHub Actions"; until then the deployment is skipped with a
# warning.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

env:
  # Blowfish v3.10.0 supports Hugo 0.166.0 to 0.169.0.
  HUGO_VERSION: 0.169.0

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages: ${{ steps.pages.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the generator dependency
        run: python -m pip install -r tests/requirements.txt
      - name: Configure Pages
        id: pages
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: actions/configure-pages@v6
      - name: Report that Pages is not enabled
        if: steps.pages.outcome == 'failure'
        run: >-
          echo "::warning title=GitHub Pages is not enabled::A repository administrator must set
          Settings > Pages > Source to GitHub Actions. The site was built and kept as the
          site-preview artifact, but not deployed."
      - name: Generate the site content
        run: python site/generate.py --base-url "${BASE_URL:-https://ignfab.github.io/geoskills}/"
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
      - name: Install Hugo
        run: |
          curl -sSLf -o "${{ runner.temp }}/hugo.tar.gz" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          mkdir -p "${HOME}/.local/hugo"
          tar -xzf "${{ runner.temp }}/hugo.tar.gz" -C "${HOME}/.local/hugo"
          echo "${HOME}/.local/hugo" >> "${GITHUB_PATH}"
      - name: Build
        run: |
          hugo version
          hugo build --source site --gc --minify \
            --baseURL "${BASE_URL:-https://ignfab.github.io/geoskills}/" \
            --cacheDir "${{ runner.temp }}/hugo-cache"
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
      - name: Check the published entry points
        run: |
          for f in index.html fr/index.html skills/index.html docs/index.html \
                   skills/2-access/geopf-wfs-download/index.html \
                   skills/2-access/geopf-wfs-download/instructions/index.html \
                   llms.txt .well-known/agent-skills/index.json; do
            test -s "site/public/$f" || { echo "missing: $f"; exit 1; }
          done
          python -c "import json; print(len(json.load(open('site/public/.well-known/agent-skills/index.json'))['skills']), 'skills in the discovery index')"
      - name: Keep the built site as an artifact
        uses: actions/upload-artifact@v7
        with:
          name: site-preview
          path: site/public
          include-hidden-files: true
          retention-days: 14
      - uses: actions/upload-pages-artifact@v5
        if: steps.pages.outcome == 'success'
        with:
          path: site/public
          # Keep .well-known/ (agent skills discovery index).
          include-hidden-files: true

  deploy:
    if: github.ref == 'refs/heads/main' && needs.build.outputs.pages == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
